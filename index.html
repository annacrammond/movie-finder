<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Finder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div>
          <a href="index.html">Movies</a>
          <a href="profile.html">Profile</a>
        </div>
      </nav>
    </header>

    <main>
      <h1>Film Finder</h1>
      <div id="Movies" class="tabcontent">
        <section>
          <h2>Search</h2>
          <form id="sub-list">
            <label>
              <input type="checkbox" name="service" value="Netflix">
              Netflix
            </label>
            <label>
              <input type="checkbox" name="service" value="Disney">
              Disney+
            </label>
            <label>
              <input type="checkbox" name="service" value="Prime Video">
              Prime Video
            </label>
            <label>
              <input type="checkbox" name="service" value="Sky">
              Sky
            </label>
            <label>
              <input type="checkbox" name="service" value="NOW">
              NOW
            </label>
          </form>
          <input type="text" id="search-input" placeholder="Search for a movie" />
          <button>Search</button>
        </section>

        <section>
          <h2>Results</h2>
          <div id="movie-list"></div>
        </section>
      </div>

      <div id="Profile" class="tabcontent">
        
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
